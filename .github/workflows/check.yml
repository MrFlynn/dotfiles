name: Check nix configuration
on:
  push:
    paths:
      - "**/*.nix"
      - "flake.lock"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Run nix syntax check
        run: |
          nix flake check
      - name: Run nixfmt check
        run: |
          nix run nixpkgs#nixfmt -- --check **/*.nix

  dry-run:
    needs: check
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Dry run home-manager switch for ${{ matrix.system }}
        run: |
          nix run github:nix-community/home-manager -- \
            switch --dry-run --flake ".#nick-$( \
              nix eval --raw --impure --expr 'builtins.currentSystem' \
            )"
